[project]
name = "forge-research-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch==2.14.1", "transformers==5.21.0", "peft==0.21.2",
  "datasets==5.1.0", "safetensors==0.8.0", "durable-actors[cli]==0.14.0",
  "fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1",
  "python-dotenv==1.2.4"
]
[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]
[tool.pytest.ini_options]
pythonpath = [".", "services/actors"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
