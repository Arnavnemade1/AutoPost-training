name: Research dashboard

on:
  push:
    paths:
      - 'apps/web/**'
      - 'services/orchestrator/**'
      - 'packages/terse-actors/**'
      - 'services/training-core/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'services/orchestrator/**'
      - 'packages/terse-actors/**'
      - 'services/training-core/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      # GitHub's runner image ships Google Chrome; FFmpeg comes from Ubuntu.
      FORGE_CHROME: /usr/bin/google-chrome
      FORGE_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/terse-actors/package-lock.json
            services/orchestrator/package-lock.json
            apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install pinned CPU training worker
        working-directory: services/training-core
        run: |
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[train]'
          echo "FORGE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install actor, orchestrator and dashboard dependencies
        run: |
          npm ci --prefix packages/terse-actors --no-audit --no-fund
          npm ci --prefix services/orchestrator --no-audit --no-fund
          npm ci --prefix apps/web --no-audit --no-fund
      - name: Typecheck and format
        working-directory: apps/web
        run: |
          npm run check
          npm run format:check
      - name: Recorded campaign, rendering, accessibility and capture-failure gates
        working-directory: apps/web
        run: npm test
